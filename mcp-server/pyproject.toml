[project]
name = "fastflow-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Fast-Flow orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
fastflow-mcp = "fastflow_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<1.5",
    "respx>=0.22.0,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
